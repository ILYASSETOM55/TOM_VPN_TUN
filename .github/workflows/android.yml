name: Android CI
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
      - uses: android-actions/setup-android@v3
      - name: Install NDK and Python
        run: |
          sdkmanager "ndk;27.2.12479018"
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip
      - name: Build official libXray Android AAR
        run: |
          mkdir -p .build app/libs
          git clone https://github.com/XTLS/libXray.git .build/libXray
          cd .build/libXray
          python3 build/main.py android
          cd "$GITHUB_WORKSPACE"
          AAR="$(find .build/libXray -type f -name '*.aar' -print -quit)"
          test -n "$AAR"
          cp "$AAR" app/libs/libXray.aar
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle assembleDebug
      - name: Run unit tests
        run: gradle testDebugUnitTest
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: tom-tunnel-debug
          path: app/build/outputs/apk/debug/*.apk

