name: Android CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK and Python
        run: |
          sdkmanager "ndk;27.2.12479018"
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip unzip curl

      - name: Build official libXray Android AAR
        run: |
          set -euo pipefail
          mkdir -p .build app/libs
          git clone https://github.com/XTLS/libXray.git .build/libXray
          cd .build/libXray
          python3 build/main.py android
          cd "$GITHUB_WORKSPACE"
          AAR="$(find .build/libXray -type f -name '*.aar' -print -quit)"
          if [ -z "$AAR" ]; then
            echo "ERROR: libXray build completed but no AAR was found."
            find .build/libXray -maxdepth 5 -type f | head -200
            exit 1
          fi
          cp "$AAR" app/libs/libXray.aar
          test -s app/libs/libXray.aar

      - name: Install Gradle 8.9
        run: |
          set -euo pipefail
          curl -fsSL https://services.gradle.org/distributions/gradle-8.9-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Run unit tests
        run: gradle --no-daemon testDebugUnitTest

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: tom-tunnel-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
