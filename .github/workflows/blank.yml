
name: TOM_TUNNEL APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build TOM_TUNNEL Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK and dependencies
        run: |
          set -euxo pipefail
          sdkmanager "ndk;27.2.12479018"
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip python3-venv \
            unzip curl git build-essential

      - name: Check Android project structure
        run: |
          set -euxo pipefail
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          grep -q 'include(":app")' settings.gradle.kts
          mkdir -p app/libs .build

      - name: Build libXray Android AAR
        run: |
          set -euxo pipefail
          git clone --depth 1 \
            https://github.com/XTLS/libXray.git .build/libXray

          cd .build/libXray
          python3 build/main.py android
          cd "$GITHUB_WORKSPACE"

          AAR="$(find .build/libXray -type f -name '*.aar' -print -quit)"

          if [ -z "$AAR" ]; then
            echo "::error::No Android AAR was generated by libXray."
            find .build/libXray -maxdepth 6 -type f -print | head -200
            exit 1
          fi

          cp "$AAR" app/libs/libXray.aar
          test -s app/libs/libXray.aar
          echo "libXray AAR copied to app/libs/libXray.aar"

      - name: Install Gradle 8.9
        run: |
          set -euxo pipefail
          curl -fL \
            https://services.gradle.org/distributions/gradle-8.9-bin.zip \
            -o "$RUNNER_TEMP/gradle.zip"
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Verify Gradle
        run: |
          set -euxo pipefail
          gradle --version
          java -version

      - name: Build debug APK
        run: |
          set -euxo pipefail
          gradle --no-daemon --stacktrace \
            :app:assembleDebug

      - name: Run unit tests
        run: |
          set -euxo pipefail
          gradle --no-daemon --stacktrace \
            :app:testDebugUnitTest

      - name: Check generated APK
        run: |
          set -euxo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -s "$APK" ]; then
            echo "::error::Debug APK was not generated at $APK"
            find app/build/outputs -type f -name '*.apk' -print || true
            exit 1
          fi
          ls -lh "$APK"

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: TOM_TUNNEL-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
